  <h1>Pravidla</h1>

  <p>Hrajou 2 hraci.</p>
  <p>Hrac 1 ma symbol X, Hrac 2 ma symbol O.</p>
  <p>Hraci se stridaji a klikaji na volne pole.</p>
  <p>Kdo prvni obsadi 3 pole v rade (radek, sloupec nebo diagonala), vyhrava.</p>
  <p>Kdyz jsou vsechna pole plna a nikdo nevyhral, je remiza.</p>
